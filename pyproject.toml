# ///////////////////////////////////////////////////////////////
# 🔨 BUILD SYSTEM
# Defines the build backend and requirements for packaging
# ///////////////////////////////////////////////////////////////

[build-system]
# Hatchling 1.32+ emits Metadata-Version 2.5, which is rejected by the
# twine bundled in pypa/gh-action-pypi-publish. Keep 1.31.x until that action
# accepts the newer metadata version.
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

# ///////////////////////////////////////////////////////////////
# 📦 PROJECT METADATA
# Package information, version, authors, and classifiers
# ///////////////////////////////////////////////////////////////

[project]
name = "ezplog"
version = "2.3.0"
description = "Modern Python logging framework with Rich console output and loguru file logging, featuring advanced display capabilities, configuration management, and a simple typed API."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Neuraaak" }]
maintainers = [{ name = "Neuraaak" }]
keywords = ["logging", "rich", "loguru", "console", "file", "framework", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Topic :: Utilities",
]

# ///////////////////////////////////////////////////////////////
# 📚 DEPENDENCIES
# Core production dependencies for runtime
# ///////////////////////////////////////////////////////////////

dependencies = [
    "loguru>=0.7.2", # Advanced file logging with rotation, retention, compression
    "rich>=13.0.0",  # Rich console rendering with colors, panels, tables, progress bars
    "click>=8.0.0",  # CLI framework for user commands
]

# ///////////////////////////////////////////////////////////////
# 🛠️ OPTIONAL DEPENDENCIES
# Development tools, testing, and build dependencies
# ///////////////////////////////////////////////////////////////

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "import-linter>=2.0.0",
]
docs = [
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-section-index>=0.3.0",
    "mkdocs-coverage>=1.1.0",
    "mike>=2.0.0",
    "pymdown-extensions>=10.7",
    "git-cliff>=2.7.0",
    "grimp>=2.3.0",
]
dev = [
    # Tests (single source of truth, no duplication)
    { include-group = "test" },

    # Documentation (single source of truth, no duplication)
    { include-group = "docs" },

    # Development tools
    "ruff>=0.1.0",
    "ty>=0.0.13",
    "pyright>=1.1.0",
    "pre-commit>=3.0.0",
    "poethepoet>=0.32",

    # Security
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",

    # Build
    "build>=1.0.0",
    "twine>=4.0.0",
]

# ///////////////////////////////////////////////////////////////
# 🔗 PROJECT URLS
# Links to repository, documentation, and package index
# ///////////////////////////////////////////////////////////////

[project.urls]
Homepage = "https://github.com/neuraaak/ezplog"
Documentation = "https://neuraaak.github.io/ezplog/"
Repository = "https://github.com/neuraaak/ezplog"
PyPI = "https://pypi.org/project/ezplog/"

# ///////////////////////////////////////////////////////////////
# 🖥️ SCRIPTS
# Entry points for command-line tools
# ///////////////////////////////////////////////////////////////

[project.scripts]
ezpl = "ezplog.cli.main:cli"

# ///////////////////////////////////////////////////////////////
# ⚡ POE TASKS
# Developer commands: run with `uv run poe <task>`
# ///////////////////////////////////////////////////////////////

[tool.poe.tasks]
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
format = "ruff format src tests"
format-check = "ruff format --check src tests"
imports = "lint-imports"
security = { help = "Run Bandit and audit locked dependencies", sequence = [
    "bandit -c pyproject.toml -r src",
    "pip-audit",
], default_item_type = "cmd" }

test = "pytest"
test-ci = "pytest --cov-fail-under=70"
test-unit = "pytest -m unit"
test-fast = "pytest -n auto -m 'not slow'"
docs = "mkdocs serve"
docs-build = "mkdocs build --strict"
graph = "python .scripts/dev/generate_architecture_graph.py"
version = "python .scripts/dev/update_version.py"
build = "uv build"

[tool.poe.tasks.typecheck]
help = "Run pyright then ty"
sequence = ["pyright", "ty check"]
default_item_type = "cmd"

[tool.poe.tasks.check]
help = "Full local quality gate (mirrors CI)"
sequence = ["format-check", "lint", "typecheck", "imports", "test"]
default_item_type = "ref"

# ///////////////////////////////////////////////////////////////
# 📦 HATCHLING CONFIGURATION
# Package discovery and inclusion/exclusion patterns
# ///////////////////////////////////////////////////////////////

[tool.hatch.build.targets.wheel]
packages = ["src/ezplog", "src/ezpl"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "docs",
    "examples",
    "htmlcov",
    ".hooks",
    ".venv",
    "venv",
    ".git",
    ".ruff_cache",
    ".pytest_cache",
    ".cursor",
    ".tmp",
    "*.pyc",
    "*.pyo",
    "*.log",
    ".coverage",
    "coverage.xml",
    ".DS_Store",
    "Thumbs.db",
]

# ///////////////////////////////////////////////////////////////
# 🎨 CODE FORMATTING & LINTING TOOLS
# Auto-formatting, import sorting, and style checking
# ///////////////////////////////////////////////////////////////

# Ruff: All-in-one linter with comprehensive rule sets
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort-compatible import sorting (via ruff)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit security
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long, handled by ruff format
    "B008", # do not perform function calls in argument defaults
    "S101", # assert_used (for tests)
    "S106", # hardcoded_password_funcarg
    "T201", # print statements (for init.py and scripts)
    "S603", # subprocess.run without check=True
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S311", "E501", "ARG002"]
"examples/**/*" = ["T201", "E501"]
"src/ezplog/cli/**/*" = ["T201", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ///////////////////////////////////////////////////////////////
# ✅ TYPE CHECKING TOOLS
# Static type analysis with minimal and comprehensive modes
# ///////////////////////////////////////////////////////////////

# ty: Type checking with minimal configuration
[tool.ty.environment]
python-version = "3.13"
root = ["src", "src/ezplog"]

[tool.ty.src]
include = ["src/ezplog/**/*.py"]
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "tests",
    "docs",
    "examples",
]

# Respect .gitignore
respect-ignore-files = true

[tool.ty.terminal]
output-format = "full"
error-on-warning = false

# Pyright: Comprehensive type checking with detailed reporting
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

# Include/exclude paths
include = ["src/ezplog"]
exclude = [
    "**/__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "tests",
    "docs",
    "examples",
    "**/node_modules",
    "**/.*",
]

# Reporting rules: flag missing imports and duplicates
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true

# Optional type checking (None safety)
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true

# Tolerance for decorators and complex types
reportUntypedFunctionDecorator = false
reportUntypedClassDecorator = false
reportUntypedBaseClass = false
reportUntypedNamedTuple = false

# Override and consistency checks
reportPrivateUsage = false
reportConstantRedefinition = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructor = true

# ///////////////////////////////////////////////////////////////
# � IMPORT LINTER CONTRACTS
# Layer dependency contracts enforced in CI
# ///////////////////////////////////////////////////////////////

[tool.importlinter]
root_packages = ["ezplog"]
# Note: import-linter 2.x ne supporte pas source_paths (feature pending PR #323).
# Le package doit être installé en mode editable (pip install -e .)
# ou lancer avec PYTHONPATH=src lint-imports

[[tool.importlinter.contracts]]
name = "layer dependency flow"
type = "layers"
layers = [
    "ezplog.cli",
    "ezplog.handlers",
    "ezplog.config",
    "ezplog.types",
    "ezplog.utils",
    "ezplog.core",
]

# ///////////////////////////////////////////////////////////////
# �🧪 TESTING & COVERAGE TOOLS
# Test execution, coverage analysis, and test configuration
# ///////////////////////////////////////////////////////////////

# Pytest: Test runner with markers and coverage configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/ezplog",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--tb=short",
    "--color=yes",
    "--durations=10",
    "--maxfail=5",
]
console_output_style = "progress"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "robustness: marks tests as robustness tests",
    "unit: marks tests as unit tests (default)",
    "wizard: marks tests related to RichWizard",
    "config: marks tests related to ConfigurationManager",
    "cli: marks tests related to CLI",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage: Code coverage measurement and reporting
[tool.coverage.run]
source = ["src/ezplog"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.pytest_cache/*",
    "*/.benchmarks/*",
    "*/.vscode/*",
    "*/.egg-info/*",
    "*/.hooks/*",
    "setup.py",
    "build/*",
    "dist/*",
    ".venv/*",
    "venv/*",
    "htmlcov/*",
    "coverage.xml",
    ".coverage",
    "docs/*",
    "examples/*",
    "_temp/*",
    # CLI entry points: tested via e2e/smoke tests, not unit tests
    "src/ezplog/cli/*",
    # Shim retro compatibility layer: tested indirectly via core and handlers tests, not directly
    "src/ezpl/*",
]

[tool.coverage.report]
# Lines to exclude: comments, abstractions, unreachable code
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if platform.system\\(\\) == \"Windows\":",
    "except ImportError:",
]
show_missing = true
precision = 2
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"

# ///////////////////////////////////////////////////////////////
# 🔒 SECURITY TOOLS
# Code security scanning and vulnerability detection
# ///////////////////////////////////////////////////////////////

# Bandit: Security linter for identifying common security issues
[tool.bandit]
exclude_dirs = [
    "tests",
    "build",
    "dist",
    "venv",
    ".venv",
    ".hooks",
    "docs",
    "examples",
    "_temp",
]
skips = ["B101", "B601"]
