name: 03 · Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag_action:
        description: "create = publish to PyPI | preview = build only"
        required: true
        type: choice
        default: preview
        options: [preview, create]
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag_action:
        required: false
        type: string
        default: create

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: ezplog

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then VERSION=$(grep -E '^version\s*=\s*"' pyproject.toml | head -1 | sed 's/.*version\s*=\s*"\([^"]*\)".*/\1/'); fi
          test -n "$VERSION" || { echo "::error::No version found in pyproject.toml"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: PYTHONPATH=src uv run --frozen poe imports
      - run: uv run --frozen poe build
      - run: uv run --frozen twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m zipfile -t dist/*.whl
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile

          wheels = glob("dist/*.whl")
          if not wheels:
              raise SystemExit("No wheel found in dist/")
          with ZipFile(wheels[0]) as wheel:
              if not any(name.startswith("ezplog/") for name in wheel.namelist()):
                  raise SystemExit("Wheel does not contain ezplog package")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    name: Publish to PyPI (OIDC)
    needs: validate
    if: inputs.tag_action == 'create'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/${{ env.PACKAGE_NAME }}/${{ needs.validate.outputs.version }}/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          attestations: false
